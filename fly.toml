# Fly.io config for turkarta-operations (support/leads bots + support CRM).
# Single machine on purpose: bot webhooks are re-registered on boot, workers run
# in-process and CRM presence lives in memory. Never scale above 1.
# First deploy: `fly deploy --ha=false`, then `fly scale count 1`, check `fly machines list`.
# Rollback: SUPPORT_SURFACE=bitrix here, or this branch on Render. Never the old Render
# image: migration 0016 breaks its addMessage. Runbook: docs/DEPLOY-STATE.md (Fly.io).
app = "turkarta-operations"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  NODE_ENV = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
